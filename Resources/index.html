        // state is the authority. Default is `launcher` in the body class, so
        // nothing is visible before the first state arrives.
        panelState: function (name) {
          // Swift is the authority on the PANEL; the page only remembers what it
          // was told, so `ensureTranscriptVisible` can tell "hidden because the
          // panel is launcher-only" (correct) from "hidden while the panel says
          // full" (a blank panel, never acceptable).
          panelStateName = name || "mascot";
          document.body.classList.toggle("launcher", name !== "full");
          // The state changed, so re-ask even if the measured value is
          // unchanged since the last post: the previous value may have been
          // ignored by Swift while it was in another state.
          requireContentHeight(true);
        },
        contextShot: function (dataURL) {
          shotURL = dataURL || null;
          renderChips();
        },
        providerStatus: function (status) {
          if (!status) { return; }
          privacyEl.classList.toggle("cloud", !!status.cloud);
          privacyLabel.textContent = status.label || "";
          privacyEl.title = status.cloud
            ? "This conversation is sent to a remote provider."
            : "This conversation runs on this Mac.";
        },
        // PRODUCTION TURN STATUS. Swift is the authority on WHEN a turn is
        // working (emitted before the first model call) and the label the user
        // reads; the page's own `setStreaming` sets the same state at send, so
        // this only confirms it from the loop and keeps the clock ticking.
        turnStatus: function (state, text) {
          if (state === "ready") { setStreamStatus("ready", text || "ready"); return; }
          setStreamStatus("thinking", text || "working… 0.0s");
        },
        // TEST HOOK: drives the SAME `setStreamStatus` the app uses, so a probe
        // can measure the composer with the status line shown without needing a
        // live model. Production never calls this; it hand-pokes nothing.
        __setStreamStatusForProbe: function (state, text) {
          setStreamStatus(state || "ready", text || "");
        },
        // TEST HOOK: clears the voice draft (transcript + base + session) the
        // SAME way Send/× do, so a probe can drive the within-session utterance
        // boundary from a known-empty base WITHOUT a live mic. Production never
        // calls this.
        __resetVoiceForProbe: function () {
          resetVoice();
        }
      };

      // Legacy shim: the M0 ping/pong handshake must keep working.
      window.__popPong = function () { setStatus("bridge ok", true); };

      // --- events -----------------------------------------------------------
      // The messages area stays hidden until this session has actually produced
      // a message. `body.launcher` is the panel-state layer; this is the content
      // layer, so a page-driven state flip alone can never reveal an empty
      // transcript. BY DEFAULT, DO NOT SHOW CHAT.
      function revealChat() {
        // Revealing the transcript and showing its NEWEST turn are one action:
        // WebKit drops a `scrollTop` assigned while the element is `display: none`
        // and hands the element back with `scrollTop === 0`, so a scroll that
        // happened before the reveal leaves the user looking at the OLDEST turn.
        var wasSuppressed = document.body.classList.contains("chat-empty");
        document.body.classList.remove("chat-empty");
        if (wasSuppressed) { scrollToBottom(); }
      }

      // THE INVARIANT: once there are turns, a transcript that is hidden while
      // Swift says the panel is `full` is a blank panel — the exact symptom
      // reported ("sent a message, no reply on screen"). Checked after every
      // completed turn and reported to the log, because a page-side invariant
      // nobody can read is an invariant nobody keeps.
      //
      // What it will NOT do is override Swift: a `bar`/`mascot` panel is
      // launcher-only by product rule, so hiding the transcript there is
      // correct and is reported as such.
      function ensureTranscriptVisible() {
        var hasTurns = !!bubbleEl.querySelector(".turn");
        document.body.classList.remove("chat-empty");
        window.__popLastVisibility = "unknown";
        if (!hasTurns) { window.__popLastVisibility = "no-content"; return "no-content"; }
        if (getComputedStyle(bubbleEl).display !== "none") {
          // This call is what just un-suppressed the content layer, so the scroll
          // that the deltas could not make has to be made now.
          scrollToBottom();
          window.__popLastVisibility = "visible";
          return "visible";
        }
        if (panelStateName !== "full") {
          window.__popLastVisibility = "launcher-state:" + panelStateName;
          return "launcher-state:" + panelStateName;
        }
        // Swift says `full`, there is content, and the transcript is hidden: the
        // state layer and the content layer disagreed. Content wins — a finished
        // answer is never worth less than the panel chrome.
        document.body.classList.remove("launcher");
        if (getComputedStyle(bubbleEl).display === "none") {
          window.__popLastVisibility = "still-hidden";
          return "still-hidden";
        }
        scrollToBottom();
        window.__popLastVisibility = "forced-visible";
        return "forced-visible";
      }

      // Dragging the composer BAR moves the whole launcher. A WKWebView swallows
      // the mouse-down AppKit needs to move its window, so the bar's inert
      // background hands the drag to Swift, which tracks the cursor itself.
      // Interactive targets are excluded so text selection and the buttons keep
      // working exactly as before.
      document.getElementById("composer").addEventListener("mousedown", function (event) {
        if (event.button !== 0) { return; }
        // WHILE STREAMING THE BAR IS INERT. A click on the composer background
        // used to start a window drag, which swallowed the click and stole
        // focus while a reply was still coming in. `preventDefault` keeps the
        // focus where it is; returning before `barDragBegin` means a stray
        // click can do nothing at all. Not streaming: unchanged.
        if (streaming) { event.preventDefault(); return; }
        var target = event.target;
        if (target && target.closest(
          "input, button, a, textarea, select, #menu, #chips, #privacy"
        )) { return; }
        event.preventDefault();
        post({ type: "barDragBegin" });
      });
      document.getElementById("composer").addEventListener("submit", function (event) {
        event.preventDefault();
        // Submit is SEND OR NOTHING. It used to double as the cancel path
        // (`chatStop`), which is why one extra click could throw away an
        // in-flight reply with no receipt and no feedback. Stopping is now the
        // stop control's job alone, and it says so in the transcript.
        if (streaming) { return; }
        send(inputEl.value);
      });
      // THE EXPLICIT STOP. `stopRequested` is a distinct message type on
      // purpose: Swift can tell "the person pressed stop" from any other
      // teardown, which is what makes the receipt honest.
      stopEl.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (!streaming) { return; }
        post({ type: "stopRequested" });
      });
      // Tapping the strip (or Enter/Space on it — it is a real focusable
      // element, not a styled div) expands the whole transcript.
      function toggleConversation() {
        // Tapping the strip OPENS THE CONVERSATION: it marks the read state and
        // brings the newest turn into view. It used to be the only thing between
        // the user and a 128pt window onto their own answer.
        document.body.classList.toggle("browser-expanded");
        scrollToBottom();
      }
      document.getElementById("browserStrip").addEventListener("click", toggleConversation);
      document.getElementById("browserStrip").addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleConversation();
        }
      });
      inputEl.addEventListener("input", updateSendButton);
      inputEl.addEventListener("focus", function () { if (menuOpen) { closeMenu(); } });
      inputEl.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          send(inputEl.value);
          return;
        }
        // Escape collapses the composer back to the robot alone.
        if (event.key === "Escape") {
          event.preventDefault();
          inputEl.blur();
          post({ type: "uiHeight", state: "mascot" });
        }
      });
      plusEl.addEventListener("click", function () {
        menuOpen ? closeMenu() : openMenu();
      });
      // The mic button posts and nothing else: Swift owns listening state and
      // pushes `voiceState` back, so the visual can never desync from reality.
      micEl.addEventListener("click", function (event) {
        event.preventDefault();
        post({ type: "voiceToggle" });
      });
      // The dialog's own controls. Its mic is the same toggle as the composer's;
      // Send is the ONLY path a voice transcript enters the pipeline; the ×
      // cancels without a turn.
      voiceMicEl.addEventListener("click", function (event) {
        event.preventDefault();
        post({ type: "voiceToggle" });
      });
      voiceSendEl.addEventListener("click", function (event) {
        event.preventDefault();
        sendVoice();
      });
      voiceCloseEl.addEventListener("click", function (event) {
        event.preventDefault();
        cancelVoice();
      });
      document.getElementById("menuNewChat").addEventListener("click", function () {
        post({ type: "newChat" });
        inputEl.focus();
      });
      // There is deliberately NO sign-in item here. It used to live in this
      // menu and did nothing visible: the browser pane is hidden unless the
      // panel is `full`, so from the resting launcher state it navigated a page
      // nobody could see. The account control now lives in Settings, where it
      // opens a real key window that is on screen and takes keystrokes.

      // Delegated actions: copy (incl. code-block headers), retry, context toggle.
      document.addEventListener("click", function (event) {
        var target = event.target;
        if (!target) { return; }

        if (target.dataset && target.dataset.copy !== undefined) {
          var text = target.dataset.copy;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(function () {
              target.title = "copy unavailable";
            });
          } else {
            target.title = "copy unavailable";
          }
          return;
        }
        if (target.dataset && target.dataset.retry !== undefined) {
          send(target.dataset.retry);
          return;
        }
        if (target.dataset && target.dataset.key) {
          var key = target.dataset.key;
          var on = target.dataset.on !== "true";
          post({ type: "contextToggle", key: key, on: on });
          // Flip locally too so the checkmark reacts immediately; Swift is
          // told, but the UI must not wait on a round trip.
          chipData = chipData.map(function (c) {
            return c.key === key ? Object.assign({}, c, { on: on }) : c;
          });
          renderChips();
        }
      });

      window.addEventListener("load", function () {
        if (!post({ type: "ping" })) { return; }
        post({ type: "uiReady" });
        updateSendButton();
        inputEl.focus();
        requireContentHeight(true);
      });
      // The web region's own height is decided by Swift, so a resize means the
      // state changed and the required content height must be re-derived.
      window.addEventListener("resize", function () { requireContentHeight(false); });

      // WEDGE-PROOF NET. Any uncaught exception anywhere in this page used to
      // leave `streaming` true, which keeps the send button in stop mode and
      // makes the composer drop every later send before it reaches Swift — the
      // page looked alive but was permanently deaf. Clearing the flag here
      // means no single bug can wedge the composer. The error is still
      // reported: this recovers state, it does not hide the fault.
      function recoverFromFault(kind) {
        try {
          if (typeof setStreaming === "function") { setStreaming(false); }
          if (typeof setStreamStatus === "function") { setStreamStatus("error", "error"); }
          if (typeof setStatus === "function") { setStatus("error", false); }
        } catch (ignored) { /* state is already the best we can do */ }
      }
      window.addEventListener("error", function (event) {
        console.error("[pop] uncaught error", event.message, event.filename,
          event.lineno, event.error);
        recoverFromFault("error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        console.error("[pop] unhandled rejection", event.reason);
        recoverFromFault("unhandledrejection");
      });
    })();
  </script>
</body>
</html>
